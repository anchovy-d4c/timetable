<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CLSFLW" />
  <title>CLSFLW // Timetable System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --coral: #d4654a;
      --coral-dark: #1a1210;
      --sage: #7a9a6d;
      --sage-dark: #141a12;
      --cream: #f5f0e8;
      --cream-dark: #1a1916;
      --orange: #e8a554;
      --orange-dark: #1a1610;
      --slate: #2a2a2a;
      --muted: #6a6a6a;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --mono: "JetBrains Mono", monospace;
      --sans: "Space Grotesk", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: var(--sans);
    }

    /* Scanline overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      z-index: 100;
    }

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .boot-box {
      width: min(500px, calc(100vw - 40px));
      border: 1px solid var(--border-strong);
      padding: 24px;
      background: var(--slate);
    }

    .boot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .boot-title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--cream);
    }

    .boot-code {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .boot-log {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 2;
      color: var(--sage);
      min-height: 140px;
      white-space: pre-line;
    }

    .boot-progress {
      margin-top: 16px;
      height: 4px;
      background: var(--border);
    }

    .boot-progress > div {
      height: 100%;
      width: 0%;
      background: var(--coral);
      transition: width 0.2s ease;
    }

    .app {
      max-width: 800px;
      margin: 0 auto;
      padding: calc(16px + var(--safe-top)) 12px calc(90px + var(--safe-bottom));
    }

    /* Bento Grid Layout */
    .bento-grid {
      display: grid;
      gap: 8px;
    }

    .bento-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .bento-middle {
      display: grid;
      grid-template-columns: 1.4fr 0.6fr;
      gap: 8px;
    }

    .bento-bottom {
      display: grid;
      grid-template-columns: 0.6fr 1.4fr;
      gap: 8px;
    }

    /* Card Base */
    .card {
      border: 1px solid var(--border);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Card Variants */
    .card-coral {
      background: var(--coral);
      color: var(--bg);
      border-color: var(--coral);
    }

    .card-sage {
      background: var(--sage);
      color: var(--bg);
      border-color: var(--sage);
    }

    .card-cream {
      background: var(--cream);
      color: var(--bg);
      border-color: var(--cream);
    }

    .card-orange {
      background: var(--orange);
      color: var(--bg);
      border-color: var(--orange);
    }

    .card-dark {
      background: var(--slate);
      color: var(--cream);
    }

    .card-outline {
      background: transparent;
      border: 1px solid var(--border-strong);
    }

    /* Typography */
    .label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .label-jp {
      font-size: 12px;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }

    .title-giant {
      font-family: var(--sans);
      font-size: clamp(48px, 12vw, 72px);
      font-weight: 700;
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .title-large {
      font-family: var(--sans);
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    .title-medium {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .code-text {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .data-value {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Hero Card */
    .hero-card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-card .corner-code {
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: var(--mono);
      font-size: 10px;
      opacity: 0.5;
    }

    .hero-card .jp-text {
      position: absolute;
      right: 16px;
      bottom: 16px;
      writing-mode: vertical-rl;
      font-size: 14px;
      letter-spacing: 0.1em;
      opacity: 0.4;
    }

    /* Info Card */
    .info-card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .arrow-icon {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
    }

    .arrow-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Status Card */
    .status-card {
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Data Display */
    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-bars {
      display: flex;
      gap: 3px;
      margin-top: 12px;
    }

    .data-bar {
      width: 16px;
      background: currentColor;
      opacity: 0.3;
    }

    .data-bar.active {
      opacity: 1;
    }

    /* Tabs */
    .tabs-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 12px 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--border-strong);
      color: var(--cream);
    }

    .tab-btn.active {
      background: var(--cream);
      color: var(--bg);
      border-color: var(--cream);
    }

    /* Content Panel */
    .content-panel {
      border: 1px solid var(--border);
      background: var(--slate);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream);
    }

    .panel-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 8px;
      background: var(--coral);
      color: var(--bg);
    }

    .panel-content {
      padding: 12px;
    }

    /* Class Card */
    .class-card {
      border: 1px solid var(--border);
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 100px 1fr;
      background: rgba(255,255,255,0.02);
    }

    .class-card:last-child {
      margin-bottom: 0;
    }

    .class-time-block {
      padding: 14px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .class-time-main {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 800;
      color: var(--cream);
    }

    .class-time-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    .class-info {
      padding: 14px;
    }

    .class-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .class-name {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--cream);
      line-height: 1.2;
    }

    .class-code {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 6px;
      background: var(--coral);
      color: var(--bg);
      flex-shrink: 0;
    }

    .class-code.AEH { background: #6f8bdf; }
    .class-code.ACCT { background: #c88bff; }
    .class-code.CFB { background: var(--coral); }
    .class-code.ECON { background: var(--orange); }
    .class-code.MATH { background: var(--sage); }

    .class-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .class-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .class-card.now {
      border-color: var(--coral);
      box-shadow: 0 0 20px rgba(212,101,74,0.15);
    }

    .class-card.now .class-time-block {
      background: var(--coral);
    }

    .class-card.now .class-time-main,
    .class-card.now .class-time-sub {
      color: var(--bg);
    }

    .class-card.past {
      opacity: 0.4;
    }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 6px;
      background: var(--coral);
      color: var(--bg);
    }

    .live-tag::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--bg);
      animation: pulse 1s ease-in-out infinite;
    }

    /* Week View */
    .week-day-card {
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .week-day-card:last-child {
      margin-bottom: 0;
    }

    .week-day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
    }

    .week-day-name {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 600;
      color: var(--cream);
    }

    .week-day-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .today-badge {
      display: inline-block;
      margin-left: 8px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 6px;
      background: var(--sage);
      color: var(--bg);
      vertical-align: middle;
    }

    .week-day-content {
      padding: 10px;
    }

    /* Subject Card */
    .subject-card {
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
    }

    .subject-card:last-child {
      margin-bottom: 0;
    }

    .subject-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .subject-title {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--cream);
    }

    .subject-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .session-row {
      display: grid;
      grid-template-columns: 40px 100px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .session-row:last-child {
      border-bottom: none;
    }

    .session-day {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--coral);
      letter-spacing: 0.05em;
    }

    .session-time {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--cream);
    }

    .session-meta {
      font-size: 12px;
      color: var(--muted);
    }

    /* Alerts */
    .alert-card {
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
    }

    .alert-card:last-child {
      margin-bottom: 0;
    }

    .alert-title {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--cream);
      margin-bottom: 8px;
    }

    .alert-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    .action-btn {
      width: 100%;
      margin-top: 14px;
      border: none;
      padding: 12px 16px;
      background: var(--cream);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: var(--coral);
    }

    .status-text {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* Empty State */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      border: 1px dashed var(--border);
    }

    .empty-state .empty-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--cream);
      margin-bottom: 8px;
    }

    .empty-state .empty-text {
      font-size: 13px;
      color: var(--muted);
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(12px + var(--safe-bottom));
      width: min(780px, calc(100vw - 24px));
      z-index: 50;
      padding: 6px;
      border: 1px solid var(--border-strong);
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 10px 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      color: var(--cream);
    }

    .nav-btn.active {
      background: var(--cream);
      color: var(--bg);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .bento-top,
      .bento-middle,
      .bento-bottom {
        grid-template-columns: 1fr;
      }

      .tabs-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .class-card {
        grid-template-columns: 80px 1fr;
      }

      .session-row {
        grid-template-columns: 35px 85px 1fr;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="boot-screen" id="bootScreen">
    <div class="boot-box">
      <div class="boot-header">
        <span class="boot-title">CLSFLW SYSTM</span>
        <span class="boot-code">v2.4.1</span>
      </div>
      <div class="boot-log" id="bootLog"></div>
      <div class="boot-progress"><div id="bootBar"></div></div>
    </div>
  </div>

  <div class="app">
    <div class="bento-grid">
      <!-- Top Row -->
      <div class="bento-top">
        <div class="card card-coral hero-card" id="heroCard">
          <!-- Filled by JS -->
        </div>
        <div class="card card-dark info-card" id="infoCard">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Middle Row -->
      <div class="bento-middle">
        <div class="card card-cream status-card" id="nextCard">
          <!-- Filled by JS -->
        </div>
        <div class="card card-sage status-card" id="statsCard">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-row" id="tabs"></div>

      <!-- Content -->
      <main id="content"></main>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="today">Today</button>
    <button class="nav-btn" data-tab="week">Week</button>
    <button class="nav-btn" data-tab="subjects">Subjects</button>
    <button class="nav-btn" data-tab="alerts">Alerts</button>
  </nav>

      {day:4,s:'09:00',e:'11:00',name:'Economics: Microeconomics',code:'ECON',type:'Tutorial',loc:'G6-B122',staff:'Samangi Bandaranayake'},
      {day:4,s:'12:00',e:'13:00',name:'Mathematics for Commerce',code:'MATH',type:'Lecture',loc:'D23-MatB',staff:'Kavitha Nagabooshanam'},
      {day:5,s:'10:00',e:'12:00',name:'Academic English for Humanities',code:'AEH',type:'Workshop',loc:'L5-W301',staff:'Mariann Banfi, Peter Alexander'},
      {day:5,s:'12:00',e:'13:00',name:'Mathematics for Commerce',code:'MATH',type:'Tutorial',loc:'G6-B107',staff:'Kavitha Nagabooshanam'},
      {day:5,s:'16:00',e:'17:30',name:'Academic English for Humanities',code:'AEH',type:'Tutorial',loc:'G6-B202',staff:'Jerome Van Putten'}
    ];

    const DAY_NAMES = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const SHORT_DAY = ['', 'MON', 'TUE', 'WED', 'THU', 'FRI'];

    let currentTab = 'today';
    let reminderTimers = [];

    function toMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function formatTime(t) {
      const [hh, mm] = t.split(':').map(Number);
      const suffix = hh >= 12 ? 'PM' : 'AM';
      const h12 = hh % 12 || 12;
      return mm === 0 ? `${h12}${suffix}` : `${h12}:${String(mm).padStart(2, '0')}${suffix}`;
    }

    function getWeekday(now = new Date()) {
      const d = now.getDay();
      return d >= 1 && d <= 5 ? d : null;
    }

    function getNowMinutes(now = new Date()) {
      return now.getHours() * 60 + now.getMinutes();
    }

    function classesForDay(day) {
      return CLASSES.filter(c => c.day === day).sort((a, b) => toMinutes(a.s) - toMinutes(b.s));
    }

    function getStatus(c, now = new Date()) {
      const today = getWeekday(now);
      if (today !== c.day) return 'other';
      const mins = getNowMinutes(now);
      if (mins > toMinutes(c.e)) return 'past';
      if (mins >= toMinutes(c.s)) return 'now';
      return 'upcoming';
    }

    function nextClassForToday(now = new Date()) {
      const day = getWeekday(now);
      if (!day) return null;
      const mins = getNowMinutes(now);
      const list = classesForDay(day);
      return list.find(c => toMinutes(c.s) > mins) || list.find(c => toMinutes(c.s) <= mins && toMinutes(c.e) >= mins) || null;
    }

    function countdownLabel(c, now = new Date()) {
      if (!c) return '--:--';
      const status = getStatus(c, now);
      if (status === 'now') return 'LIVE';
      const delta = toMinutes(c.s) - getNowMinutes(now);
      const h = Math.floor(delta / 60);
      const m = delta % 60;
      return h > 0 ? `${h}H ${m}M` : `${m}M`;
    }

    function renderHeader() {
      const now = new Date();
      const day = getWeekday(now);
      const next = nextClassForToday(now);
      const todayClasses = day ? classesForDay(day) : [];
      const timeStr = now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false });

      // Hero Card (Coral)
      document.getElementById('heroCard').innerHTML = `
        <span class="corner-code">#${String(now.getDate()).padStart(2, '0')}${String(now.getMonth() + 1).padStart(2, '0')}</span>
        <div>
          <div class="label">CLSFLW</div>
          <div class="title-giant" style="margin-top: 8px;">
            ${day ? SHORT_DAY[day] : 'OFF'}
          </div>
        </div>
        <div>
          <div class="code-text" style="opacity: 0.7;">${now.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase()}</div>
        </div>
        <span class="jp-text">時間割</span>
      `;

      // Info Card (Dark)
      document.getElementById('infoCard').innerHTML = `
        <div class="arrow-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 17L17 7M17 7H7M17 7V17"/>
          </svg>
        </div>
        <div>
          <div class="label" style="color: var(--muted);">SYSTEM TIME</div>
          <div class="data-value" style="margin-top: 8px; color: var(--cream);">${timeStr}</div>
        </div>
        <div>
          <div class="label" style="color: var(--muted);">STATUS</div>
          <div class="status-indicator" style="margin-top: 6px;">
            <span class="status-dot" style="color: ${day ? 'var(--sage)' : 'var(--muted)'}"></span>
            <span class="code-text" style="color: var(--cream);">${day ? 'ACTIVE' : 'STANDBY'}</span>
          </div>
        </div>
      `;

      // Next Card (Cream)
      document.getElementById('nextCard').innerHTML = `
        <div>
          <div class="label">NEXT MODULE</div>
          <div class="title-medium" style="margin-top: 8px;">${next ? next.name : (day ? 'CLEAR' : 'WEEKEND')}</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
          <div>
            <div class="code-text" style="opacity: 0.6;">${next ? `${next.type} // ${next.loc}` : 'NO PENDING CLASSES'}</div>
          </div>
          <div class="data-value">${countdownLabel(next, now)}</div>
        </div>
      `;

      // Stats Card (Sage)
      document.getElementById('statsCard').innerHTML = `
        <div>
          <div class="label">TODAY</div>
          <div class="title-large" style="margin-top: 4px;">${todayClasses.length}</div>
        </div>
        <div>
          <div class="code-text" style="opacity: 0.7;">CLASSES SCHEDULED</div>
          <div class="data-bars">
            ${Array(5).fill(0).map((_, i) => `<div class="data-bar ${i < todayClasses.length ? 'active' : ''}" style="height: ${20 + Math.random() * 30}px;"></div>`).join('')}
          </div>
        </div>
      `;
    }

    function classCard(c, forcedStatus = null) {
      const status = forcedStatus || getStatus(c);
      return `
        <article class="class-card ${status === 'past' ? 'past' : ''} ${status === 'now' ? 'now' : ''}">
          <div class="class-time-block">
            <div class="class-time-main">${formatTime(c.s)}</div>
            <div class="class-time-sub">${formatTime(c.e)}</div>
          </div>
          <div class="class-info">
            <div class="class-header">
              <span class="class-name">${c.name}</span>
              <span class="class-code ${c.code}">${c.code}</span>
            </div>
            <div class="class-meta">
              ${status === 'now' ? '<span class="live-tag">LIVE</span>' : ''}
              <span>${c.type}</span>
              <span>${c.loc}</span>
              <span>${c.staff.split(',')[0]}</span>
            </div>
          </div>
        </article>
      `;
    }

    function renderToday() {
      const day = getWeekday();
      const list = day ? classesForDay(day) : [];
      return `
        <div class="content-panel">
          <div class="panel-header">
            <span class="panel-title">Today Log</span>
            <span class="panel-badge">${day ? SHORT_DAY[day] : 'OFF'}</span>
          </div>
          <div class="panel-content">
            ${!day
              ? '<div class="empty-state"><div class="empty-title">WEEKEND MODE</div><div class="empty-text">No classes scheduled. System on standby.</div></div>'
              : list.length
                ? list.map(c => classCard(c)).join('')
                : '<div class="empty-state"><div class="empty-title">CLEAR</div><div class="empty-text">No classes scheduled for today.</div></div>'
            }
          </div>
        </div>
      `;
    }

    function renderWeek() {
      const today = getWeekday();
      let html = `
        <div class="content-panel">
          <div class="panel-header">
            <span class="panel-title">Week Matrix</span>
            <span class="panel-badge">MON-FRI</span>
          </div>
          <div class="panel-content">
      `;
      for (let d = 1; d <= 5; d++) {
        const list = classesForDay(d);
        html += `
          <div class="week-day-card">
            <div class="week-day-header">
              <div class="week-day-name">${DAY_NAMES[d]} ${today === d ? '<span class="today-badge">TODAY</span>' : ''}</div>
              <div class="week-day-count">${list.length} CLASS${list.length === 1 ? '' : 'ES'}</div>
            </div>
            <div class="week-day-content">
              ${list.length
                ? list.map(c => classCard(c, today === d ? null : 'other')).join('')
                : '<div class="empty-state"><div class="empty-text">No classes.</div></div>'
              }
            </div>
          </div>
        `;
      }
      html += `</div></div>`;
      return html;
    }

    function renderSubjects() {
      const codes = [...new Set(CLASSES.map(c => c.code))];
      return `
        <div class="content-panel">
          <div class="panel-header">
            <span class="panel-title">Subject Index</span>
            <span class="panel-badge">${codes.length} LOADED</span>
          </div>
          <div class="panel-content">
            ${codes.map(code => {
              const list = CLASSES.filter(c => c.code === code).sort((a, b) => a.day - b.day || toMinutes(a.s) - toMinutes(b.s));
              return `
                <div class="subject-card">
                  <div class="subject-header">
                    <span class="subject-title">${list[0].name}</span>
                    <span class="subject-count">${list.length} SESSIONS/WK</span>
                  </div>
                  ${list.map(c => `
                    <div class="session-row">
                      <div class="session-day">${SHORT_DAY[c.day]}</div>
                      <div class="session-time">${formatTime(c.s)}-${formatTime(c.e)}</div>
                      <div class="session-meta">${c.type} / ${c.loc}</div>
                    </div>
                  `).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function requestNotifications() {
      if (!('Notification' in window)) {
        alert('Notifications are not supported in this browser.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') scheduleTodayReminders();
        render();
      });
    }

    function scheduleTodayReminders() {
      reminderTimers.forEach(clearTimeout);
      reminderTimers = [];

      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const day = getWeekday();
      if (!day) return;

      const now = new Date();
      const mins = getNowMinutes(now);

      classesForDay(day).forEach(c => {
        const delay = (toMinutes(c.s) - 15 - mins) * 60000;
        if (delay > 0) {
          const timer = setTimeout(() => {
            new Notification('Class in 15 minutes', {
              body: `${c.name} / ${c.type} / ${c.loc} / starts ${formatTime(c.s)}`
            });
          }, delay);
          reminderTimers.push(timer);
        }
      });
    }

    function renderAlerts() {
      const permission = 'Notification' in window ? Notification.permission : 'unsupported';
      const statusText =
        permission === 'granted'
          ? 'NOTIFICATIONS: ON'
          : permission === 'denied'
            ? 'NOTIFICATIONS: BLOCKED'
            : permission === 'unsupported'
              ? 'NOTIFICATIONS: UNSUPPORTED'
              : 'NOTIFICATIONS: OFF';

      return `
        <div class="content-panel">
          <div class="panel-header">
            <span class="panel-title">Alerts</span>
            <span class="panel-badge">SYSTEM</span>
          </div>
          <div class="panel-content">
            <div class="alert-card">
              <div class="alert-title">Class Reminders</div>
              <div class="alert-text">
                Enable local notifications to receive alerts 15 minutes before each class. Reminders are generated daily for the current schedule.
              </div>
              <button class="action-btn" onclick="requestNotifications()">ENABLE REMINDERS</button>
              <div class="status-text">${statusText}</div>
            </div>

            <div class="alert-card">
              <div class="alert-title">Night-Before Messaging</div>
              <div class="alert-text">
                External automation required for scheduled DMs. Connect via Telegram bot or IFTTT for 10 PM nightly schedule summaries.
              </div>
            </div>

            <div class="alert-card">
              <div class="alert-title">iOS Installation</div>
              <div class="alert-text">
                Safari > Share > Add to Home Screen. The app will run in standalone mode with full-screen display and offline capability.
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTabs() {
      const defs = [
        ['today', 'Today'],
        ['week', 'Week'],
        ['subjects', 'Subjects'],
        ['alerts', 'Alerts']
      ];

      document.getElementById('tabs').innerHTML = defs.map(([id, label]) => `
        <button class="tab-btn ${currentTab === id ? 'active' : ''}" data-tab="${id}">${label}</button>
      `).join('');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === currentTab);
        btn.onclick = () => switchTab(btn.dataset.tab);
      });
    }

    function renderContent() {
      const content = document.getElementById('content');
      if (currentTab === 'today') content.innerHTML = renderToday();
      else if (currentTab === 'week') content.innerHTML = renderWeek();
      else if (currentTab === 'subjects') content.innerHTML = renderSubjects();
      else content.innerHTML = renderAlerts();
    }

    function render() {
      renderHeader();
      renderTabs();
      renderContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      render();
    }

    function runBootSequence() {
      const bootScreen = document.getElementById('bootScreen');
      const bootLog = document.getElementById('bootLog');
      const bootBar = document.getElementById('bootBar');

      const lines = [
        'INIT CLSFLW CORE...',
        'SYNC TIMETABLE MODULE...',
        'LOAD SUBJECT INDEX...',
        'MOUNT INTERFACE...',
        'READY.'
      ];

      let index = 0;
      const interval = setInterval(() => {
        if (index < lines.length) {
          bootLog.textContent += lines[index] + '\n';
          bootBar.style.width = `${((index + 1) / lines.length) * 100}%`;
          index++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            bootScreen.classList.add('hidden');
          }, 400);
        }
      }, 200);
    }

    setInterval(() => {
      renderHeader();
      if (currentTab === 'today') renderContent();
    }, 1000);

    setInterval(() => {
      scheduleTodayReminders();
    }, 60000);

    if ('Notification' in window && Notification.permission === 'granted') {
      scheduleTodayReminders();
    }

    render();
    runBootSequence();
  </script>
</body>
</html>
